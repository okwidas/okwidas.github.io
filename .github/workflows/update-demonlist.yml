name: Update demonlist

on:
  schedule:
    # every 3 hours on the hour (pointercrate rate-limits tight bursts)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # pointercrate sits behind a cloudflare challenge that refuses plain curl
      # from datacenter IPs, so we drive a real (headless) browser instead,
      # exactly like the local updater does.
      - name: Install playwright + chromium
        run: |
          cd dlist
          npm init -y > /dev/null
          npm i playwright > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1

      - name: Fetch demonlist (list + records + placement history)
        run: |
          cd dlist
          LISTHEADED=1 xvfb-run -a node fetch.js

      - name: Commit changes if the data moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dlist/data/demonlist.json dlist/data/records.json dlist/data/history.json dlist/data/updated_at.txt
          git diff --cached --quiet || (git commit -m "auto: update demonlist" && git push)
