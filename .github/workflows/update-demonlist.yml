name: Update demonlist

on:
  schedule:
    # runs at the top of every hour
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch demonlist from pointercrate
        run: |
          set -euo pipefail
          mkdir -p dlist/data
          : > /tmp/demons_pages.jsonl
          after=""
          while :; do
            url="https://pointercrate.com/api/v2/demons/?limit=100"
            [ -n "$after" ] && url="${url}&after=${after}"
            curl -sf -H "Accept: application/json" "$url" -o /tmp/demons_page.json
            count="$(jq -r 'length' /tmp/demons_page.json)"
            [ "$count" -gt 0 ] || break
            jq -c '.[]' /tmp/demons_page.json >> /tmp/demons_pages.jsonl
            next="$(jq -r '.[-1].id' /tmp/demons_page.json)"
            [ "$next" = "$after" ] && break
            after="$next"
          done
          jq -s '[ .[] | select(.position != null and .position <= 150) ] | sort_by(.position)' \
            /tmp/demons_pages.jsonl > /tmp/demonlist.new.json
          final="$(jq 'length' /tmp/demonlist.new.json)"
          echo "entries: $final"
          # never clobber the good data with an empty/broken list
          [ "$final" -gt 0 ] || { echo "no entries, keeping last good data"; exit 1; }
          mv /tmp/demonlist.new.json dlist/data/demonlist.json
          date -u +"%Y-%m-%dT%H:%M:%SZ" > dlist/data/updated_at.txt

      - name: Commit changes if the list moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dlist/data/demonlist.json dlist/data/updated_at.txt
          git diff --cached --quiet || (git commit -m "auto: update demonlist" && git push)