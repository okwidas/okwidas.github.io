name: Update demonlist

on:
  schedule:
    # runs at the top of every hour
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch demonlist from pointercrate
        run: |
          mkdir -p dlist/data
          curl -sf -H "Accept: application/json" \
            "https://pointercrate.com/api/v2/demons/listed/?limit=200" \
            | jq '[ .[] | select(.position != null and .position <= 150) ] | sort_by(.position)' \
            > dlist/data/demonlist.json
          date -u +"%Y-%m-%dT%H:%M:%SZ" > dlist/data/updated_at.txt

      - name: Commit changes if the list moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dlist/data/demonlist.json dlist/data/updated_at.txt
          git diff --cached --quiet || (git commit -m "auto: update demonlist" && git push)