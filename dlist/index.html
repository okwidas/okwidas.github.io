<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dlist</title>
<style>
  :root{
    --bg:#100e16; --bg-deep:#0b0911; --panel:#151022; --panel-soft:#120d1c;
    --border:rgba(201,174,242,.14); --border-strong:rgba(201,174,242,.28);
    --text:#e7e3ee; --dim:#8d84a3; --faint:#4c445e;
    --accent:#c9aef2; --accent-soft:rgba(201,174,242,.14); --accent-soft2:rgba(201,174,242,.22);
    --font:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,"Liberation Mono",monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--bg); color:var(--text); font-family:var(--font); }
  body{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:40px 20px 130px; position:relative; overflow-x:hidden; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  body::before{ content:""; position:fixed; inset:0; background:radial-gradient(700px 300px at 50% -120px, rgba(201,174,242,.07), transparent 70%); pointer-events:none; z-index:0; }

  .wrap{ position:relative; z-index:1; width:100%; max-width:860px;
    background:linear-gradient(180deg, rgba(201,174,242,.04), transparent 120px), var(--panel);
    border:1px solid var(--border); border-radius:18px;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 24px 50px -30px rgba(0,0,0,.7);
    padding:28px 36px 40px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:26px; margin-bottom:28px; border-bottom:1px solid var(--border); }
  .wordmark{ font-size:17px; letter-spacing:.02em; color:var(--dim); text-decoration:none; }
  .wordmark b{ color:var(--accent); font-weight:600; }
  .topnav{ display:flex; gap:6px; }
  .topnav a{ color:var(--faint); text-decoration:none; font-size:12.5px; padding:6px 11px; border-radius:7px; transition:color .15s ease, background .15s ease; }
  .topnav a:hover{ color:var(--text); background:var(--accent-soft); }
  .topnav a.on{ color:var(--accent); background:var(--accent-soft); }

  .sec{ display:flex; align-items:center; gap:12px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin-bottom:12px; }
  .sec b{ color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums; }
  .sec::after{ content:""; flex:1; height:1px; background:var(--border); }

  h1{ font-size:24px; font-weight:600; }
  .meta{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:8px 0 28px; }
  .meta .sub{ font-size:12px; color:var(--dim); }
  .meta .updated{ font-size:11px; color:var(--faint); }
  .meta .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px rgba(201,174,242,.5); display:inline-block; margin-right:5px; vertical-align:1px; }

  /* table */
  .sink{ border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    position:sticky; top:-1px;
    background:var(--panel-soft);
    text-align:left;
    font-weight:500;
    color:var(--faint);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding:12px 14px;
    border-bottom:1px solid var(--border-strong);
  }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr.row{ cursor:pointer; transition:background .12s ease; }
  tbody tr.row:hover{ background:rgba(201,174,242,.06); }
  tbody tr.row:hover .name{ color:var(--accent); }
  .pos{ color:var(--accent); font-weight:600; width:52px; font-variant-numeric:tabular-nums; }
  .name{ color:var(--text); transition:color .12s ease; }
  .muted{ color:var(--faint); }
  .req{ color:var(--dim); font-variant-numeric:tabular-nums; }

  .empty{ text-align:center; color:var(--faint); font-size:13px; padding:60px 20px; border:1px dashed var(--border-strong); border-radius:12px; }
  .foot-note{ margin-top:20px; font-size:10.5px; color:var(--faint); line-height:1.7; }

  /* modal */
  #modal[hidden]{ display:none; }
  #modal{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  #modal .backdrop{ position:absolute; inset:0; background:rgba(5,3,9,.72); backdrop-filter:blur(3px); }
  #modal .card{
    position:relative; z-index:1; width:100%; max-width:620px; max-height:min(88vh, 820px);
    overflow-y:auto;
    background:linear-gradient(180deg, rgba(201,174,242,.05), transparent 140px), var(--panel);
    border:1px solid var(--border-strong); border-radius:16px;
    box-shadow:0 24px 60px -24px rgba(0,0,0,.8);
    padding:24px 26px 22px;
  }
  .m-head{ display:flex; align-items:baseline; gap:10px; padding-right:34px; }
  .m-pos{ color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums; }
  .m-name{ font-size:19px; font-weight:600; }
  .m-close{ position:absolute; top:16px; right:16px; background:var(--accent-soft); border:1px solid var(--border-strong); color:var(--text); width:30px; height:30px; border-radius:9px; cursor:pointer; font-family:var(--font); font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; transition:background .15s ease, color .15s ease; }
  .m-close:hover{ background:var(--accent); color:var(--bg); }

  .m-video{ position:relative; margin-top:16px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#000; aspect-ratio:16/9; }
  .m-video img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .m-video .play{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.25); border-radius:12px; cursor:pointer; transition:background .15s ease; }
  .m-video .play:hover{ background:rgba(0,0,0,.45); }
  .m-video .play svg{ width:58px; height:58px; filter:drop-shadow(0 4px 14px rgba(0,0,0,.6)); }
  .m-video iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }

  .m-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-top:18px; }
  .m-grid .cell{ background:var(--panel-soft); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .m-grid .k{ font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:4px; }
  .m-grid .v{ font-size:13px; color:var(--text); word-break:break-word; }
  .m-grid a{ color:var(--accent); text-decoration:none; }
  .m-grid a:hover{ text-decoration:underline; }

  .m-hist{ margin-top:18px; background:var(--panel-soft); border:1px solid var(--border); border-radius:10px; }
  .m-hist summary{ cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; padding:10px 12px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); user-select:none; }
  .m-hist summary::-webkit-details-marker{ display:none; }
  .m-hist summary::before{ content:"\25B8"; margin-right:8px; color:var(--accent); transition:transform .12s ease; }
  .m-hist[open] summary::before{ transform:rotate(90deg); }
  .m-hist .peak{ color:var(--accent); font-weight:600; }
  .m-hist-list{ border-top:1px solid var(--border); max-height:240px; overflow-y:auto; }
  .m-hist .hentry{ display:flex; align-items:baseline; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border); font-size:12px; }
  .m-hist .hentry:last-child{ border-bottom:none; }
  .h-pos{ color:var(--accent); font-weight:600; width:48px; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .h-date{ color:var(--faint); width:84px; font-size:10.5px; flex-shrink:0; }
  .h-note{ color:var(--dim); }
  .m-hist .none{ color:var(--faint); font-size:12px; padding:10px 12px; }

  .m-rec{ margin-top:18px; }
  .m-rec .r-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .m-rec .r-title{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .m-rec .r-count{ font-size:10.5px; color:var(--faint); }
  .m-rec-list{ border:1px solid var(--border); border-radius:10px; max-height:260px; overflow-y:auto; }
  .m-rec-list .rec{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--border); font-size:12.5px; }
  .m-rec-list .rec:last-child{ border-bottom:none; }
  .rec .pct{ color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums; width:52px; }
  .rec .who{ flex:1; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rec .tag{ font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); border:1px solid var(--border); border-radius:5px; padding:2px 6px; }
  .rec .tag.ok{ color:var(--accent); border-color:var(--accent-soft2); }
  .m-rec .none{ color:var(--faint); font-size:12px; padding:6px 2px; }

  .go-home{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:10; display:inline-flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border-strong); border-radius:14px; color:var(--text); text-decoration:none; font-family:var(--font); font-size:13px; padding:13px 26px; box-shadow:0 14px 30px -18px rgba(0,0,0,.8); transition:background .16s ease, color .16s ease, border-color .16s ease; }
  .go-home .arrow{ color:var(--accent); transition:transform .16s ease; }
  .go-home:hover{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .go-home:hover .arrow{ color:var(--bg); transform:translateX(-3px); }

  @media (max-width:640px){
    body{ padding:20px 12px 120px; }
    .wrap{ padding:20px 14px 30px; }
    .topnav a{ font-size:11.5px; padding:5px 8px; }
    thead th{ padding:10px 10px; }
    tbody td{ padding:10px; }
    .hide-mobile{ display:none; }
    #modal .card{ padding:18px 16px; }
    .m-name{ font-size:16px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <a href="../" class="wordmark">okwidas<b>.github.io</b></a>
    <nav class="topnav">
      <a href="../typewriter/">typewriter</a>
      <a href="../dlist/" class="on">dlist</a>
      <a href="../links.html">links</a>
    </nav>
  </header>

  <div class="sec"><b>01</b> dlist</div>

  <h1>demonlist</h1>
  <div class="meta">
    <span class="sub">a working mirror of pointercrate/demonlist — click any row for details.</span>
    <span class="updated"><span class="dot"></span><span id="updated">checking…</span></span>
  </div>

  <div id="content">loading…</div>
  <p class="foot-note" id="dataNote"></p>

</div>

<a href="../" class="go-home"><span class="arrow">&larr;</span><span>back home</span></a>

<div id="modal" hidden aria-hidden="true">
  <div class="backdrop"></div>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="m-close" id="mClose" aria-label="close">&times;</button>
    <div class="m-head">
      <span class="m-pos" id="mPos"></span>
      <span class="m-name" id="mName"></span>
    </div>
    <div class="m-video" id="mVideo"></div>
    <div class="m-grid" id="mGrid"></div>
    <details class="m-hist" id="mHist" hidden></details>
    <div class="m-rec" id="mRec"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  function pick(obj, keys, fallback){
    for (var i = 0; i < keys.length; i++){
      var v = obj && obj[keys[i]];
      if (v !== undefined && v !== null) return v;
    }
    return fallback;
  }
  function nameOf(v){
    if (v === undefined || v === null) return "";
    if (typeof v === "string") return v;
    if (typeof v === "object") return v.name || v.username || "";
    return String(v);
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function ytId(url){
    var m = String(url || "").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

  var recordsMap = {};
  var historyMap = {};
  var byId = {};

  function buildModal(d){
    document.getElementById("mPos").textContent = "#" + pick(d, ["position", "rank"], "?");
    document.getElementById("mName").textContent = pick(d, ["name"], "unknown");

    // video preview: thumbnail + play → embed
    var video = page_video = pick(d, ["video"], null);
    var vid = ytId(video);
    var thumb = pick(d, ["thumbnail"], null) || (vid ? "https://i.ytimg.com/vi/" + vid + "/hqdefault.jpg" : null);
    var vbox = document.getElementById("mVideo");
    vbox.innerHTML = "";
    if (thumb){
      var img = document.createElement("img");
      img.src = thumb;
      img.alt = "preview";
      var play = document.createElement("div");
      play.className = "play";
      play.setAttribute("role", "button");
      play.setAttribute("aria-label", "play preview");
      play.innerHTML = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.55)" stroke="rgba(255,255,255,.9)" stroke-width="1"/><path d="M9.5 8.2v7.6a.4.4 0 0 0 .6.35l6.4-3.8a.4.4 0 0 0 0-.7l-6.4-3.8a.4.4 0 0 0-.6.35z" fill="rgba(255,255,255,.95)"/></svg>';
      var once = false;
      play.addEventListener("click", function(){
        if (once || !vid) return;
        once = true;
        var ifr = document.createElement("iframe");
        ifr.src = "https://www.youtube-nocookie.com/embed/" + vid + "?rel=0&autoplay=1";
        ifr.allow = "autoplay; encrypted-media; picture-in-picture";
        ifr.setAttribute("allowfullscreen", "");
        vbox.innerHTML = "";
        vbox.appendChild(ifr);
      });
      vbox.appendChild(img);
      vbox.appendChild(play);
    } else {
      vbox.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-size:12px">no video preview</div>';
    }

    // info grid
    var verifier = esc(nameOf(pick(d, ["verifier"], "")));
    var creator = esc(nameOf(pick(d, ["publisher"], "")));
    var req = pick(d, ["requirement", "points"], null);
    var levelId = pick(d, ["level_id"], null);
    var vd = victorData(d);
    var cells = [
      ["verifier", verifier || "—"],
      ["creator", creator || "—"],
      ["requirement", req !== null && req !== undefined ? esc(String(req)) + "%" : "—"],
      ["level id", levelId !== null && levelId !== undefined ? esc(String(levelId)) : "—"],
      ["victors", String(vd.total)]
    ];
    var gridHtml = cells.map(function(c){
      return '<div class="cell"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div></div>';
    }).join("");
    if (video){
      gridHtml += '<div class="cell"><div class="k">video</div><div class="v"><a href="' + esc(video) +
        '" target="_blank" rel="noopener">watch on youtube &nearr;</a></div></div>';
    }
    document.getElementById("mGrid").innerHTML = gridHtml;

    // placement history (dropdown)
    renderHistory(d);

    // completions
    renderRecords(d);
  }

  function renderHistory(d){
    var hbox = document.getElementById("mHist");
    var hist = historyMap[d.id];
    if (hist === undefined){ hbox.hidden = true; hbox.innerHTML = ""; return; }
    hbox.hidden = false;
    if (!hist.length){
      hbox.innerHTML = '<summary><span>placement history</span><span class="peak">no placement changes</span></summary>' +
        '<div class="none">no recorded position changes for this one.</div>';
      return;
    }
    var peak = Math.min.apply(null, hist.map(function(h){ return h.pos; }));
    var rows = hist.map(function(h){
      return '<div class="hentry"><span class="h-pos">#' + esc(String(h.pos)) + '</span>' +
        '<span class="h-date">' + esc(String(h.time || "").slice(0, 10)) + '</span>' +
        '<span class="h-note">' + esc(h.note || "position change") + '</span></div>';
    }).join("");
    hbox.innerHTML =
      '<summary><span>placement history</span><span class="peak">peak #' + esc(String(peak)) + ' &middot; ' + hist.length + ' changes</span></summary>' +
      '<div class="m-hist-list">' + rows + '</div>';
  }

  var page_video = null;

  function victorData(d){
    var recs = recordsMap[d.id] || [];
    var done = recs.filter(function(r){ return (r.progress || 0) >= 100; });
    var pending = recs.filter(function(r){ var p = r.progress || 0; return p > 0 && p < 100; });
    var ver = nameOf(pick(d, ["verifier"], ""));
    var hasVer = ver !== "" && !done.some(function(r){
      return String(r.player || "").toLowerCase() === ver.toLowerCase();
    });
    return { done: done, pending: pending, ver: ver, hasVer: hasVer, total: done.length + (hasVer ? 1 : 0) };
  }

  function byPctName(a, b){
    if ((b.progress||0) !== (a.progress||0)) return (b.progress||0) - (a.progress||0);
    return String(a.player||"").toLowerCase().localeCompare(String(b.player||"").toLowerCase());
  }

  function renderRecords(d){
    var box = document.getElementById("mRec");
    var vd = victorData(d);

    // victors = the verifier (always a victor) + everyone with 100%
    var victors = [];
    if (vd.hasVer) victors.push({ player: vd.ver, progress: 100, special: "verifier" });
    victors = victors.concat(vd.done.slice().sort(byPctName));
    var shownVictors = victors.slice(0, 120);

    var html = '<div class="r-head"><span class="r-title">victors</span>' +
      '<span class="r-count">' + vd.total + (vd.total === 1 ? " victor" : " victors") + '</span></div>';
    if (shownVictors.length === 0){
      html += '<div class="none">no victors yet — neither the verifier nor any 100% completion is recorded.</div>';
    } else {
      html += '<div class="m-rec-list">' + shownVictors.map(function(r){
        var tag;
        if (r.special) tag = "verifier";
        else if (r.status === "approved" || r.status === "completed") tag = "listed";
        else tag = (r.status || "completed") + " ← " + (r.progress || 0) + "%";
        return '<div class="rec">' +
          '<span class="pct">' + esc(String(r.progress != null ? r.progress : 100)) + '%</span>' +
          '<span class="who" title="' + esc(r.player || "") + '">' + esc(r.player || "unknown") + '</span>' +
          '<span class="tag ok">' + esc(tag) + '</span>' +
          '</div>';
      }).join("") + '</div>';
      if (victors.length > shownVictors.length){
        html += '<div class="none">+ ' + (victors.length - shownVictors.length) + ' more</div>';
      }
    }

    // people who reached list percentage but never finished: NOT victors
    if (vd.pending.length){
      var pp = vd.pending.slice().sort(byPctName).slice(0, 120);
      html += '<div class="r-head" style="margin-top:16px"><span class="r-title">list percentage — not victors</span>' +
        '<span class="r-count">' + vd.pending.length + '</span></div>';
      html += '<div class="m-rec-list">' + pp.map(function(r){
        return '<div class="rec">' +
          '<span class="pct">' + esc(String(r.progress)) + '%</span>' +
          '<span class="who" title="' + esc(r.player || "") + '">' + esc(r.player || "unknown") + '</span>' +
          '<span class="tag">' + esc(r.status || "progress") + '</span>' +
          '</div>';
      }).join("") + '</div>';
      if (vd.pending.length > pp.length){
        html += '<div class="none">+ ' + (vd.pending.length - pp.length) + ' more</div>';
      }
    }

    box.innerHTML = html;
  }

  function openModal(d){
    buildModal(d);
    document.getElementById("modal").hidden = false;
    document.getElementById("modal").setAttribute("aria-hidden", "false");
    document.getElementById("mClose").focus();
    document.body.style.overflow = "hidden";
  }
  function closeModal(){
    document.getElementById("modal").hidden = true;
    document.getElementById("modal").setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  function render(demons){
    var el = document.getElementById("content");
    if (!demons || demons.length === 0){
      el.innerHTML = '<div class="empty">no data yet — the update job hasn\'t run for the first time.<br>go to Actions → "Update demonlist" → Run workflow.</div>';
      return;
    }
    byId = {};
    demons.forEach(function(d){ byId[d.id] = d; });
    var rows = demons.map(function(d){
      var position = pick(d, ["position", "rank"], "?");
      var name = esc(pick(d, ["name"], "unknown"));
      var publisher = esc(nameOf(pick(d, ["publisher"], "")));
      var verifier = esc(nameOf(pick(d, ["verifier"], "")));
      var points = pick(d, ["requirement", "points"], null);
      return '<tr class="row" data-id="' + esc(String(d.id)) + '">' +
        '<td class="pos">' + esc(position) + "</td>" +
        '<td class="name">' + name + "</td>" +
        '<td class="muted hide-mobile">' + publisher + "</td>" +
        '<td class="muted hide-mobile">' + verifier + "</td>" +
        '<td class="req">' + (points !== null ? esc(points) + "%" : "—") + "</td>" +
        "</tr>";
    }).join("");

    el.innerHTML =
      '<div class="sink"><table>' +
      "<thead><tr>" +
      "<th>#</th><th>demon</th><th class=\"hide-mobile\">publisher</th><th class=\"hide-mobile\">verifier</th><th>req</th>" +
      "</tr></thead>" +
      "<tbody>" + rows + "</tbody>" +
      "</table></div>";

    el.querySelector("tbody").addEventListener("click", function(ev){
      var tr = ev.target.closest("tr.row");
      if (!tr) return;
      var d = byId[tr.getAttribute("data-id")];
      if (d) openModal(d);
    });
  }

  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("modal").querySelector(".backdrop").addEventListener("click", closeModal);
  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape" && !document.getElementById("modal").hidden) closeModal();
  });

  fetch("data/demonlist.json", { cache: "no-store" })
    .then(function(r){ return r.json(); })
    .then(function(data){
      var list = Array.isArray(data) ? data : (data.demons || []);
      render(list);
      if (list.length){
        document.getElementById("dataNote").textContent =
          "showing " + list.length + " listed demons. this copy updates hourly from github's side — no direct calls from your browser.";
      }
    })
    .catch(function(){
      document.getElementById("content").innerHTML =
        '<div class="empty">couldn\'t load data/demonlist.json — make sure the file exists in this repo.</div>';
    });

  fetch("data/records.json", { cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(data){
      recordsMap = (data && data.demons) || {};
    })
    .catch(function(){ recordsMap = {}; });

  fetch("data/history.json", { cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(data){
      historyMap = (data && data.demons) || {};
    })
    .catch(function(){ historyMap = {}; });

  fetch("data/updated_at.txt", { cache: "no-store" })
    .then(function(r){ return r.text(); })
    .then(function(t){
      document.getElementById("updated").textContent = "last updated " + t.trim() + " UTC";
    })
    .catch(function(){
      document.getElementById("updated").textContent = "update time unknown";
    });
})();
</script>
</body>
</html>
